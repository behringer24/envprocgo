name: Release build

on:
  release:
    types: [created]

jobs:
  releases-matrix:
    name: Release Go Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # build and publish in parallel: linux/amd64
        goos: [windows, linux]
        goarch: [amd64, "386"]
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: go test -v -p=1 -timeout=0 ./...
      # v1.37 built the Go download URL from `curl https://go.dev/VERSION?m=text`
      # without taking the first line. That endpoint returns two lines now, the
      # version and a timestamp, so the URL contained a newline and the download
      # failed. Fixed upstream by piping through `head -n1`.
      - uses: wangyoucao577/go-release-action@v1.55
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          project_path: "./"
          binary_name: "envproc"
          ldflags: "-s -w"
          extra_files: LICENSE README.md